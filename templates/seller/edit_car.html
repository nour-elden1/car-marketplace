{% extends "layout/base.html" %} {% block title %}Edit Car - Car Marketplace{%
endblock %} {% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-body p-5">
          <h2 class="card-title mb-4">Edit Car Listing</h2>

          <form method="POST" enctype="multipart/form-data">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="title" class="form-label">Car Title *</label>
                <input
                  type="text"
                  class="form-control"
                  id="title"
                  name="title"
                  value="{{ car.title }}"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label for="brand" class="form-label">Brand *</label>
                <input
                  type="text"
                  class="form-control"
                  id="brand"
                  name="brand"
                  value="{{ car.brand }}"
                  required
                />
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="model" class="form-label">Model *</label>
                <input
                  type="text"
                  class="form-control"
                  id="model"
                  name="model"
                  value="{{ car.model }}"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label for="year" class="form-label">Year *</label>
                <input
                  type="number"
                  class="form-control"
                  id="year"
                  name="year"
                  min="1990"
                  max="2099"
                  value="{{ car.year }}"
                  required
                />
              </div>
            </div>

            <div class="mb-3">
              <label for="price" class="form-label">Price ($) *</label>
              <input
                type="number"
                class="form-control"
                id="price"
                name="price"
                step="0.01"
                min="0"
                value="{{ car.price }}"
                required
              />
            </div>

            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea
                class="form-control"
                id="description"
                name="description"
                rows="4"
              >
{{ car.description or '' }}</textarea
              >
            </div>

            <div class="mb-4">
              <label for="image" class="form-label"
                >Car Image (PNG, JPG, GIF)</label
              >
              <div class="mb-2">
                <img
                  src="{{ url_for('static', filename='uploads/' + car.image) }}"
                  alt="{{ car.title }}"
                  style="height: 200px; object-fit: cover; border-radius: 5px"
                />
                <p class="text-muted small mt-2">Current image</p>
              </div>
              <input
                type="file"
                class="form-control"
                id="image"
                name="image"
                accept=".png,.jpg,.jpeg,.gif"
              />
              <small class="text-muted"
                >Upload a new image to replace the current one (optional)</small
              >
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg">
                Update Car
              </button>
              <a
                href="{{ url_for('seller_dashboard') }}"
                class="btn btn-secondary"
                >Cancel</a
              >
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
