{% extends "layout/base.html" %} {% block title %}Register - Car Marketplace{%
endblock %} {% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-body p-5">
          <h2 class="card-title text-center mb-4">Create Account</h2>

          <form method="POST">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                required
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="At least 6 characters"
                required
              />
            </div>

            <div class="mb-3">
              <label for="confirm_password" class="form-label"
                >Confirm Password</label
              >
              <input
                type="password"
                class="form-control"
                id="confirm_password"
                name="confirm_password"
                required
              />
            </div>

            <div class="mb-4">
              <label for="role" class="form-label">I want to:</label>
              <select class="form-select" id="role" name="role" required>
                <option value="buyer" selected>Buy cars</option>
                <option value="seller">Sell cars</option>
              </select>
              <small class="text-muted d-block mt-2">
                ℹ️ You can change your role later if needed.
              </small>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
              Create Account
            </button>
          </form>

          <p class="text-center mb-0">
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
